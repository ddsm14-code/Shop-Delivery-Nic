<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Shop Delivery Nic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { green: '#0AAD0A', dark: '#108910' } } } }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <nav class="bg-gray-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center font-bold text-xl">
                    <i class="fas fa-cogs text-brand-green mr-2"></i> Shop Delivery Nic - Admin
                </div>
                <div id="navAuth"></div>
            </div>
        </div>
    </nav>

    <div id="globalError" class="hidden max-w-md mx-auto mt-4 bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded shadow-sm">
        <p class="font-bold">Error del sistema:</p>
        <p id="globalErrorText" class="text-sm"></p>
    </div>

    <div id="loginView" class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-center mb-6 text-brand-green">Acceso Administrativo</h2>
        <form onsubmit="handleLogin(event)">
            <input type="email" id="adminEmail" placeholder="Correo electrónico" required class="w-full border p-3 rounded mb-4 focus:outline-none focus:border-brand-green">
            <input type="password" id="adminPassword" placeholder="Contraseña" required class="w-full border p-3 rounded mb-4 focus:outline-none focus:border-brand-green">
            <div class="cf-turnstile mb-6 flex justify-center" data-sitekey="0x4AAAAAACXbc62TDsPPe09R"></div>
            <button type="submit" id="loginBtn" class="w-full bg-brand-green text-white font-bold py-3 rounded hover:bg-brand-dark transition shadow-lg">Entrar al Panel</button>
        </form>
    </div>

    <div id="dashboardView" class="hidden max-w-7xl mx-auto px-4 mt-8 pb-10">
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-gray-800 flex flex-col justify-center">
                <p class="text-xs text-gray-500 font-bold uppercase tracking-wide">Nuevas (Hoy)</p>
                <h3 class="text-3xl font-bold text-gray-800" id="metricToday">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-yellow-400 flex flex-col justify-center">
                <p class="text-xs text-gray-500 font-bold uppercase tracking-wide">Pendientes</p>
                <h3 class="text-3xl font-bold text-yellow-600" id="metricPending">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-400 flex flex-col justify-center">
                <p class="text-xs text-gray-500 font-bold uppercase tracking-wide">En Camino</p>
                <h3 class="text-3xl font-bold text-blue-600" id="metricOnWay">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500 flex flex-col justify-center">
                <p class="text-xs text-gray-500 font-bold uppercase tracking-wide">Entregadas</p>
                <h3 class="text-3xl font-bold text-brand-green" id="metricDelivered">0</h3>
            </div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div class="flex items-center w-full md:w-auto gap-2">
                <i class="fas fa-search text-gray-400"></i>
                <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="Buscar nombre, teléfono o ID..." class="w-full md:w-64 border-none focus:outline-none text-sm bg-transparent">
            </div>
            <div class="flex items-center w-full md:w-auto gap-3">
                <select id="statusFilter" onchange="renderTable()" class="border p-2 rounded text-sm focus:outline-none focus:border-brand-green bg-gray-50">
                    <option value="all">Todos los estados</option>
                    <option value="pendiente">Solo Pendientes</option>
                    <option value="en camino">Solo En Camino</option>
                    <option value="entregado">Solo Entregadas</option>
                    <option value="cancelado">Solo Canceladas</option>
                </select>
                <button onclick="loadAllOrders()" class="bg-brand-green text-white px-4 py-2 rounded shadow hover:bg-brand-dark transition flex items-center text-sm font-bold">
                    <i class="fas fa-sync-alt mr-2"></i> Recargar
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wide border-b border-gray-200">
                            <th class="p-4 font-semibold">Fecha / ID</th>
                            <th class="p-4 font-semibold">Cliente</th>
                            <th class="p-4 font-semibold">Zona / Pago</th>
                            <th class="p-4 font-semibold text-center">Acciones</th>
                            <th class="p-4 font-semibold text-center">Estado de Envío</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="divide-y divide-gray-100 text-sm">
                        <tr><td colspan="5" class="p-8 text-center text-gray-500">Cargando órdenes desde Supabase...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-5xl w-full max-h-[95vh] overflow-hidden flex flex-col">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <h3 class="font-bold text-lg text-gray-800" id="modalTitle">Gestión de Orden</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 transition text-2xl leading-none">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-grow bg-gray-50/50" id="modalContent">
                </div>
            
            <div class="p-4 border-t bg-gray-50 flex justify-end gap-3">
                <button onclick="closeModal()" class="bg-gray-800 text-white px-6 py-2 rounded shadow hover:bg-gray-900 transition font-bold">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        // Tasa de cambio oficial definida
        const TASA_CAMBIO = 36.62;

        function showGlobalError(msg) {
            document.getElementById('globalErrorText').innerText = msg;
            document.getElementById('globalError').classList.remove('hidden');
            document.getElementById('loginBtn').innerText = "Entrar al Panel";
            document.getElementById('loginBtn').disabled = false;
        }

        try {
            const SUPABASE_URL = "https://dltpvajfltfzayhomufx.supabase.co"; 
            const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsdHB2YWpmbHRmemF5aG9tdWZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NzkyOTAsImV4cCI6MjA4NTQ1NTI5MH0.HCldnUI4sm9BHepUDgcqs4v4a5yVa20VWSzt2lNQ_Vo";
            const ADMIN_EMAIL = "ddsm14@gmail.com";

            if (!window.supabase) throw new Error("La librería de Supabase no cargó correctamente.");
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            
            let currentOrdersData = [];

            supabase.auth.getSession().then(({ data, error }) => {
                if (error) throw error;
                const session = data?.session;
                if (session && session.user && session.user.email) {
                    if (session.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                        showDashboard();
                    } else { supabase.auth.signOut(); }
                }
            }).catch(err => showGlobalError("Error de sesión: " + err.message));

            window.handleLogin = async function(e) {
                e.preventDefault();
                const email = document.getElementById('adminEmail').value.trim().toLowerCase();
                const password = document.getElementById('adminPassword').value;
                const captchaToken = document.querySelector('[name="cf-turnstile-response"]')?.value;
                const btn = document.getElementById('loginBtn');

                document.getElementById('globalError').classList.add('hidden');

                if (email !== ADMIN_EMAIL.toLowerCase()) { showGlobalError("Acceso denegado: Este correo no tiene permisos."); return; }
                if (!captchaToken) { showGlobalError("Por favor, marca la casilla de seguridad."); return; }

                btn.innerText = "Verificando..."; btn.disabled = true;

                const { data, error } = await supabase.auth.signInWithPassword({ 
                    email: email, password: password, options: { captchaToken: captchaToken }
                });

                if (error) showGlobalError(error.message);
                else showDashboard();
            };

            window.showDashboard = function() {
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('globalError').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                document.getElementById('navAuth').innerHTML = `<button onclick="logout()" class="text-gray-300 hover:text-white text-sm font-bold bg-gray-800 px-4 py-2 rounded transition"><i class="fas fa-sign-out-alt mr-1"></i> Salir</button>`;
                loadAllOrders();
            };

            window.logout = async function() { await supabase.auth.signOut(); window.location.reload(); };

            window.loadAllOrders = async function() {
                const tbody = document.getElementById('ordersTableBody');
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Cargando órdenes...</td></tr>`;

                const { data: orders, error } = await supabase.from('orders').select('*').order('created_at', { ascending: false });

                if (error) { tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">Error: ${error.message}</td></tr>`; return; }

                currentOrdersData = orders || [];
                updateMetrics();
                renderTable();
            };

            window.updateMetrics = function() {
                const today = new Date().toLocaleDateString();
                let countToday = 0, countPending = 0, countOnWay = 0, countDelivered = 0;

                currentOrdersData.forEach(o => {
                    const orderDate = new Date(o.created_at).toLocaleDateString();
                    if (orderDate === today) countToday++;
                    if (o.status === 'pendiente') countPending++;
                    if (o.status === 'en camino') countOnWay++;
                    if (o.status === 'entregado') countDelivered++;
                });

                document.getElementById('metricToday').innerText = countToday;
                document.getElementById('metricPending').innerText = countPending;
                document.getElementById('metricOnWay').innerText = countOnWay;
                document.getElementById('metricDelivered').innerText = countDelivered;
            };

            window.renderTable = function() {
                const searchTxt = document.getElementById('searchInput').value.toLowerCase();
                const statusFlt = document.getElementById('statusFilter').value;
                const tbody = document.getElementById('ordersTableBody');

                const filtered = currentOrdersData.filter(o => {
                    const matchSearch = (o.full_name || '').toLowerCase().includes(searchTxt) || (o.phone || '').includes(searchTxt) || (o.id || '').toLowerCase().includes(searchTxt);
                    const matchStatus = statusFlt === 'all' || o.status === statusFlt;
                    return matchSearch && matchStatus;
                });

                if (filtered.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">No se encontraron resultados.</td></tr>`; return; }

                let html = '';
                filtered.forEach(order => {
                    const dateObj = new Date(order.created_at);
                    const date = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const shortId = order.id.slice(0, 8);
                    
                    let bgStatus = "bg-yellow-100 text-yellow-800 border-yellow-200";
                    if (order.status === 'en camino') bgStatus = "bg-blue-100 text-blue-800 border-blue-200";
                    if (order.status === 'entregado') bgStatus = "bg-green-100 text-green-800 border-green-200";
                    if (order.status === 'cancelado') bgStatus = "bg-red-100 text-red-800 border-red-200";

                    let paymentBadge = "bg-gray-100 text-gray-600";
                    if (order.payment_status === 'Pagado') paymentBadge = "bg-green-100 text-green-700 border border-green-200";
                    if (order.payment_status === 'Pago parcial') paymentBadge = "bg-blue-100 text-blue-700 border border-blue-200";
                    if (order.payment_status === 'Pendiente de pago') paymentBadge = "bg-red-50 text-red-600 border border-red-200";

                    const noteIcon = order.internal_notes && order.internal_notes.trim() !== '' ? `<i class="fas fa-sticky-note text-yellow-500 ml-2" title="Tiene nota"></i>` : '';

                    html += `
                        <tr class="hover:bg-green-50 transition duration-150 border-b border-gray-100">
                            <td class="p-4">
                                <div class="font-mono text-xs font-bold text-gray-500 mb-1">#${shortId}</div>
                                <div class="text-xs text-gray-600"><i class="far fa-calendar-alt"></i> ${date}</div>
                            </td>
                            <td class="p-4">
                                <div class="font-bold text-gray-800">${order.full_name || 'Sin Nombre'} ${noteIcon}</div>
                                <div class="text-xs text-gray-500 mt-1"><i class="fas fa-phone mr-1"></i> ${order.phone || 'N/A'}</div>
                            </td>
                            <td class="p-4">
                                <div class="font-bold text-brand-green text-sm mb-1">${order.delivery_zone || 'N/A'}</div>
                                <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded ${paymentBadge}">${order.payment_status || 'Pendiente de pago'}</span>
                            </td>
                            <td class="p-4 text-center">
                                <button type="button" onclick="openModal('${order.id}')" class="bg-white hover:bg-gray-100 text-brand-green py-1.5 px-4 rounded text-xs font-bold transition shadow-sm border border-brand-green">
                                    <i class="fas fa-folder-open mr-1"></i> Abrir
                                </button>
                            </td>
                            <td class="p-4 text-center">
                                <select onchange="updateStatus('${order.id}', this.value)" id="select-${order.id}" class="text-xs font-bold uppercase tracking-wide border rounded-full px-3 py-1.5 cursor-pointer focus:outline-none appearance-none text-center shadow-sm ${bgStatus}">
                                    <option value="pendiente" ${order.status === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                                    <option value="en camino" ${order.status === 'en camino' ? 'selected' : ''}>En Camino</option>
                                    <option value="entregado" ${order.status === 'entregado' ? 'selected' : ''}>Entregado</option>
                                    <option value="cancelado" ${order.status === 'cancelado' ? 'selected' : ''}>Cancelado</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            };

            window.updateStatus = async function(orderId, newStatus) {
                const { error } = await supabase.from('orders').update({ status: newStatus }).eq('id', orderId);
                if (error) { alert("Error al actualizar: " + error.message); } 
                else {
                    const orderIndex = currentOrdersData.findIndex(o => o.id === orderId);
                    if(orderIndex > -1) currentOrdersData[orderIndex].status = newStatus;
                    updateMetrics(); renderTable();
                }
            };

            // MODAL Y FINANZAS
            window.openModal = function(orderId) {
                const order = currentOrdersData.find(o => o.id === orderId);
                if(!order) return;
                
                document.getElementById('modalTitle').innerText = `Gestión de Orden #${order.id.slice(0,8)}`;
                
                const html = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        <div class="lg:col-span-2 flex flex-col gap-4">
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                    <p class="text-xs text-gray-500 font-bold uppercase mb-3 border-b pb-2">Información del Cliente</p>
                                    <p class="text-sm mb-2"><i class="fas fa-user text-brand-green w-5"></i> <span class="font-bold">${order.full_name || 'N/A'}</span></p>
                                    <p class="text-sm mb-2"><i class="fas fa-envelope text-brand-green w-5"></i> ${order.user_email || 'N/A'}</p>
                                    <p class="text-sm mb-3"><i class="fas fa-phone text-brand-green w-5"></i> ${order.phone || 'N/A'}</p>
                                    <div class="bg-green-50 p-3 rounded-lg border border-green-100">
                                        <p class="text-xs font-bold text-green-800 mb-2"><i class="fab fa-whatsapp"></i> Notificar Estado:</p>
                                        <div class="flex gap-2">
                                            <button onclick="sendWA('${order.phone}', '${order.full_name}', 'es')" class="bg-green-500 hover:bg-green-600 text-white text-xs px-3 py-1.5 rounded shadow transition font-bold">ES</button>
                                            <button onclick="sendWA('${order.phone}', '${order.full_name}', 'en')" class="bg-gray-800 hover:bg-black text-white text-xs px-3 py-1.5 rounded shadow transition font-bold">EN</button>
                                        </div>
                                    </div>
                                </div>

                                <div class="flex flex-col gap-4">
                                    <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                        <p class="text-xs text-gray-500 font-bold uppercase mb-2">Dirección de Entrega</p>
                                        <p class="font-bold text-brand-green text-sm">${order.delivery_zone || 'N/A'}</p>
                                        <p class="text-sm mt-1 text-gray-700">${order.delivery_address || 'N/A'}</p>
                                    </div>
                                    <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-200 shadow-sm flex-grow flex flex-col">
                                        <p class="text-xs text-yellow-800 font-bold uppercase mb-2"><i class="fas fa-lock mr-1"></i> Notas Internas</p>
                                        <textarea id="internalNotes-${order.id}" class="w-full text-xs p-2 rounded border border-yellow-300 focus:outline-none focus:border-yellow-500 flex-grow mb-2 bg-yellow-50/50">${order.internal_notes || ''}</textarea>
                                        <button onclick="saveNotes('${order.id}')" id="btnSaveNotes-${order.id}" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white text-xs font-bold py-1.5 rounded shadow transition">Guardar Notas</button>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                <p class="text-xs text-gray-500 font-bold uppercase mb-2"><i class="fas fa-list mr-1"></i> Lista Original</p>
                                <div class="bg-gray-800 text-green-400 p-4 rounded-lg text-xs font-mono whitespace-pre-wrap overflow-x-auto shadow-inner border-l-4 border-brand-green max-h-48 overflow-y-auto">${order.shopping_list || 'Sin detalles.'}</div>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-md h-fit">
                            <h4 class="text-brand-green font-bold border-b pb-2 mb-4"><i class="fas fa-file-invoice-dollar mr-2"></i>Control Financiero</h4>
                            
                            <div class="grid grid-cols-2 gap-3 mb-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">Subtotal (C$)</label>
                                    <input type="number" id="finSubtotal-${order.id}" value="${order.subtotal || 0}" step="0.01" oninput="calcFinances('${order.id}')" class="w-full border p-2 rounded text-sm bg-gray-50 focus:border-brand-green outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">IVA (C$)</label>
                                    <input type="number" id="finIva-${order.id}" value="${order.tax_iva || 0}" step="0.01" oninput="calcFinances('${order.id}')" class="w-full border p-2 rounded text-sm bg-gray-50 focus:border-brand-green outline-none">
                                </div>
                            </div>

                            <div class="bg-gray-800 text-white p-3 rounded-lg mb-4 text-center">
                                <p class="text-xs text-gray-400 uppercase tracking-wide">Total a Cobrar</p>
                                <p class="text-xl font-bold">C$ <span id="displayTotalNio-${order.id}">0.00</span></p>
                                <p class="text-sm text-green-400 font-mono">Ref: $ <span id="displayTotalUsd-${order.id}">0.00</span></p>
                            </div>

                            <p class="text-xs text-gray-500 font-bold uppercase mb-2 border-t pt-4">Abonos / Pagos Recibidos</p>
                            <div class="grid grid-cols-2 gap-3 mb-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">En C$</label>
                                    <input type="number" id="finPaidNio-${order.id}" value="${order.paid_nio || 0}" step="0.01" oninput="calcFinances('${order.id}')" class="w-full border p-2 rounded text-sm bg-green-50 border-green-200 focus:border-brand-green outline-none text-green-800 font-bold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">En $</label>
                                    <input type="number" id="finPaidUsd-${order.id}" value="${order.paid_usd || 0}" step="0.01" oninput="calcFinances('${order.id}')" class="w-full border p-2 rounded text-sm bg-green-50 border-green-200 focus:border-brand-green outline-none text-green-800 font-bold">
                                </div>
                            </div>

                            <div id="balanceBox-${order.id}" class="p-3 rounded-lg mb-4 text-center border">
                                <p class="text-xs font-bold uppercase" id="balanceLabel-${order.id}">Saldo Pendiente</p>
                                <p class="text-lg font-bold" id="balanceAmount-${order.id}">C$ 0.00</p>
                            </div>

                            <div class="space-y-3 mb-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">Estado de Pago</label>
                                    <select id="finStatus-${order.id}" class="w-full border p-2 rounded text-sm focus:border-brand-green outline-none">
                                        <option value="Pendiente de pago" ${order.payment_status === 'Pendiente de pago' ? 'selected' : ''}>Pendiente de pago</option>
                                        <option value="Pago parcial" ${order.payment_status === 'Pago parcial' ? 'selected' : ''}>Pago parcial</option>
                                        <option value="Pagado" ${order.payment_status === 'Pagado' ? 'selected' : ''}>Pagado</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">Método de Pago</label>
                                    <select id="finMethod-${order.id}" class="w-full border p-2 rounded text-sm focus:border-brand-green outline-none">
                                        <option value="">Seleccionar...</option>
                                        <option value="Efectivo" ${order.payment_method === 'Efectivo' ? 'selected' : ''}>Efectivo</option>
                                        <option value="Transferencia" ${order.payment_method === 'Transferencia' ? 'selected' : ''}>Transferencia</option>
                                        <option value="Depósito" ${order.payment_method === 'Depósito' ? 'selected' : ''}>Depósito</option>
                                        <option value="Mixto" ${order.payment_method === 'Mixto' ? 'selected' : ''}>Mixto</option>
                                    </select>
                                </div>
                            </div>

                            <button onclick="saveFinances('${order.id}')" id="btnSaveFinances-${order.id}" class="w-full bg-brand-green hover:bg-brand-dark text-white font-bold py-3 rounded-lg shadow-lg transition flex justify-center items-center">
                                <i class="fas fa-save mr-2"></i> Guardar Finanzas
                            </button>
                        </div>
                    </div>
                `;
                document.getElementById('modalContent').innerHTML = html;
                document.getElementById('detailsModal').classList.remove('hidden');
                calcFinances(orderId); // Calcular inicial
            };

            window.closeModal = function() { document.getElementById('detailsModal').classList.add('hidden'); };

            window.sendWA = function(phoneRaw, name, lang) {
                if(!phoneRaw) { alert("Sin teléfono."); return; }
                let cleanPhone = phoneRaw.replace(/[^\d+]/g, '');
                let firstName = name ? name.split(' ')[0] : 'Cliente';
                let text = lang === 'es' ? `¡Hola ${firstName}! Te escribimos de Shop Delivery Nic para confirmarte que tu pedido ya va en camino. 🚚` : `Hello ${firstName}! This is Shop Delivery Nic. Your order is on its way. 🚚`;
                window.open(`https://wa.me/${cleanPhone.replace('+','')}?text=${encodeURIComponent(text)}`, '_blank');
            };

            window.saveNotes = async function(orderId) {
                const btn = document.getElementById(`btnSaveNotes-${orderId}`);
                const notes = document.getElementById(`internalNotes-${orderId}`).value;
                btn.innerText = "Guardando...";
                const { error } = await supabase.from('orders').update({ internal_notes: notes }).eq('id', orderId);
                if (error) { alert("Error: " + error.message); btn.innerText = "Guardar Notas"; } 
                else {
                    const idx = currentOrdersData.findIndex(o => o.id === orderId);
                    if(idx > -1) currentOrdersData[idx].internal_notes = notes;
                    btn.innerText = "¡Guardado!";
                    setTimeout(() => btn.innerText = "Guardar Notas", 2000);
                    renderTable();
                }
            };

            // LÓGICA FINANCIERA (Cálculos en tiempo real)
            window.calcFinances = function(orderId) {
                const subtotal = parseFloat(document.getElementById(`finSubtotal-${orderId}`).value) || 0;
                const iva = parseFloat(document.getElementById(`finIva-${orderId}`).value) || 0;
                
                const totalNio = subtotal + iva;
                const totalUsd = totalNio / TASA_CAMBIO;

                document.getElementById(`displayTotalNio-${orderId}`).innerText = totalNio.toFixed(2);
                document.getElementById(`displayTotalUsd-${orderId}`).innerText = totalUsd.toFixed(2);

                const paidNio = parseFloat(document.getElementById(`finPaidNio-${orderId}`).value) || 0;
                const paidUsd = parseFloat(document.getElementById(`finPaidUsd-${orderId}`).value) || 0;

                // Convertir pago USD a NIO para el balance global
                const totalPaidInNio = paidNio + (paidUsd * TASA_CAMBIO);
                const balance = totalNio - totalPaidInNio;

                const box = document.getElementById(`balanceBox-${orderId}`);
                const lbl = document.getElementById(`balanceLabel-${orderId}`);
                const amt = document.getElementById(`balanceAmount-${orderId}`);

                if (totalNio === 0) {
                    box.className = "p-3 rounded-lg mb-4 text-center border bg-gray-50 border-gray-200 text-gray-500";
                    lbl.innerText = "Sin cargos"; amt.innerText = "C$ 0.00";
                } else if (balance > 0.05) { // Margen de centavos
                    box.className = "p-3 rounded-lg mb-4 text-center border bg-red-50 border-red-200 text-red-700";
                    lbl.innerText = "Falta por Pagar (Saldo)"; amt.innerText = `C$ ${balance.toFixed(2)}`;
                } else if (balance < -0.05) {
                    box.className = "p-3 rounded-lg mb-4 text-center border bg-blue-50 border-blue-200 text-blue-700";
                    lbl.innerText = "Dar Vuelto a Favor"; amt.innerText = `C$ ${Math.abs(balance).toFixed(2)}`;
                } else {
                    box.className = "p-3 rounded-lg mb-4 text-center border bg-green-50 border-green-200 text-green-700";
                    lbl.innerText = "Solvente / Pago Completo"; amt.innerText = "C$ 0.00";
                }
            };

            window.saveFinances = async function(orderId) {
                const btn = document.getElementById(`btnSaveFinances-${orderId}`);
                btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Guardando...`;

                const dataToSave = {
                    subtotal: parseFloat(document.getElementById(`finSubtotal-${orderId}`).value) || 0,
                    tax_iva: parseFloat(document.getElementById(`finIva-${orderId}`).value) || 0,
                    paid_nio: parseFloat(document.getElementById(`finPaidNio-${orderId}`).value) || 0,
                    paid_usd: parseFloat(document.getElementById(`finPaidUsd-${orderId}`).value) || 0,
                    payment_status: document.getElementById(`finStatus-${orderId}`).value,
                    payment_method: document.getElementById(`finMethod-${orderId}`).value
                };

                const { error } = await supabase.from('orders').update(dataToSave).eq('id', orderId);
                
                if (error) {
                    alert("Error guardando finanzas: " + error.message);
                    btn.innerHTML = `<i class="fas fa-save mr-2"></i> Guardar Finanzas`;
                } else {
                    const idx = currentOrdersData.findIndex(o => o.id === orderId);
                    if(idx > -1) {
                        currentOrdersData[idx] = { ...currentOrdersData[idx], ...dataToSave };
                    }
                    btn.className = "w-full bg-green-500 text-white font-bold py-3 rounded-lg shadow-lg transition flex justify-center items-center";
                    btn.innerHTML = `<i class="fas fa-check mr-2"></i> ¡Datos Guardados!`;
                    renderTable(); // Para que el estado de pago se actualice en la tabla
                    setTimeout(() => {
                        btn.className = "w-full bg-brand-green hover:bg-brand-dark text-white font-bold py-3 rounded-lg shadow-lg transition flex justify-center items-center";
                        btn.innerHTML = `<i class="fas fa-save mr-2"></i> Guardar Finanzas`;
                    }, 2000);
                }
            };

        } catch(error) { showGlobalError("Fallo general: " + error.message); }
    </script>
</body>
</html>
