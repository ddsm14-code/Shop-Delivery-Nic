<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Shop Delivery Nic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brand: { green: '#0AAD0A', dark: '#108910' } } }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <nav class="bg-gray-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center font-bold text-xl">
                    <i class="fas fa-cogs text-brand-green mr-2"></i> Shop Delivery Nic - Admin
                </div>
                <div id="navAuth"></div>
            </div>
        </div>
    </nav>

    <div id="globalError" class="hidden max-w-md mx-auto mt-4 bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded shadow-sm">
        <p class="font-bold">Error del sistema:</p>
        <p id="globalErrorText" class="text-sm"></p>
    </div>

    <div id="loginView" class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-center mb-6 text-brand-green">Acceso Administrativo</h2>
        <form onsubmit="handleLogin(event)">
            <input type="email" id="adminEmail" placeholder="Correo electrónico" required class="w-full border p-3 rounded mb-4 focus:outline-none focus:border-brand-green">
            <input type="password" id="adminPassword" placeholder="Contraseña" required class="w-full border p-3 rounded mb-4 focus:outline-none focus:border-brand-green">
            <div class="cf-turnstile mb-6 flex justify-center" data-sitekey="0x4AAAAAACXbc62TDsPPe09R"></div>
            <button type="submit" id="loginBtn" class="w-full bg-brand-green text-white font-bold py-3 rounded hover:bg-brand-dark transition shadow-lg">Entrar al Panel</button>
        </form>
    </div>

    <div id="dashboardView" class="hidden max-w-7xl mx-auto px-4 mt-8 pb-10">
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-gray-800 flex flex-col justify-center">
                <p class="text-xs text-gray-500 font-bold uppercase tracking-wide">Nuevas (Hoy)</p>
                <h3 class="text-3xl font-bold text-gray-800" id="metricToday">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-yellow-400 flex flex-col justify-center">
                <p class="text-xs text-gray-500 font-bold uppercase tracking-wide">Pendientes</p>
                <h3 class="text-3xl font-bold text-yellow-600" id="metricPending">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-400 flex flex-col justify-center">
                <p class="text-xs text-gray-500 font-bold uppercase tracking-wide">En Camino</p>
                <h3 class="text-3xl font-bold text-blue-600" id="metricOnWay">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500 flex flex-col justify-center">
                <p class="text-xs text-gray-500 font-bold uppercase tracking-wide">Entregadas</p>
                <h3 class="text-3xl font-bold text-brand-green" id="metricDelivered">0</h3>
            </div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div class="flex items-center w-full md:w-auto gap-2">
                <i class="fas fa-search text-gray-400"></i>
                <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="Buscar nombre, teléfono o ID..." class="w-full md:w-64 border-none focus:outline-none text-sm bg-transparent">
            </div>
            <div class="flex items-center w-full md:w-auto gap-3">
                <select id="statusFilter" onchange="renderTable()" class="border p-2 rounded text-sm focus:outline-none focus:border-brand-green bg-gray-50">
                    <option value="all">Todos los estados</option>
                    <option value="pendiente">Solo Pendientes</option>
                    <option value="en camino">Solo En Camino</option>
                    <option value="entregado">Solo Entregadas</option>
                    <option value="cancelado">Solo Canceladas</option>
                </select>
                <button onclick="loadAllOrders()" class="bg-brand-green text-white px-4 py-2 rounded shadow hover:bg-brand-dark transition flex items-center text-sm font-bold">
                    <i class="fas fa-sync-alt mr-2"></i> Recargar
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wide border-b border-gray-200">
                            <th class="p-4 font-semibold">Fecha / ID</th>
                            <th class="p-4 font-semibold">Cliente</th>
                            <th class="p-4 font-semibold">Zona</th>
                            <th class="p-4 font-semibold text-center">Acciones</th>
                            <th class="p-4 font-semibold text-center">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="divide-y divide-gray-100 text-sm">
                        <tr><td colspan="5" class="p-8 text-center text-gray-500">Cargando órdenes desde Supabase...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-3xl w-full max-h-[95vh] overflow-hidden flex flex-col">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <h3 class="font-bold text-lg text-gray-800" id="modalTitle">Detalle de la Orden</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 transition text-2xl leading-none">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-grow" id="modalContent">
                </div>
            
            <div class="p-4 border-t bg-gray-50 flex justify-end gap-3">
                <button onclick="closeModal()" class="bg-gray-800 text-white px-6 py-2 rounded shadow hover:bg-gray-900 transition font-bold">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        function showGlobalError(msg) {
            document.getElementById('globalErrorText').innerText = msg;
            document.getElementById('globalError').classList.remove('hidden');
            document.getElementById('loginBtn').innerText = "Entrar al Panel";
            document.getElementById('loginBtn').disabled = false;
        }

        try {
            const SUPABASE_URL = "https://dltpvajfltfzayhomufx.supabase.co"; 
            const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsdHB2YWpmbHRmemF5aG9tdWZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NzkyOTAsImV4cCI6MjA4NTQ1NTI5MH0.HCldnUI4sm9BHepUDgcqs4v4a5yVa20VWSzt2lNQ_Vo";
            const ADMIN_EMAIL = "ddsm14@gmail.com";

            if (!window.supabase) throw new Error("La librería de Supabase no cargó correctamente.");
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            
            let currentOrdersData = [];

            // 1. Verificación Inicial
            supabase.auth.getSession().then(({ data, error }) => {
                if (error) throw error;
                const session = data?.session;
                if (session && session.user && session.user.email) {
                    if (session.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                        showDashboard();
                    } else { supabase.auth.signOut(); }
                }
            }).catch(err => showGlobalError("Error de sesión: " + err.message));

            // 2. Login
            window.handleLogin = async function(e) {
                e.preventDefault();
                const email = document.getElementById('adminEmail').value.trim().toLowerCase();
                const password = document.getElementById('adminPassword').value;
                const captchaToken = document.querySelector('[name="cf-turnstile-response"]')?.value;
                const btn = document.getElementById('loginBtn');

                document.getElementById('globalError').classList.add('hidden');

                if (email !== ADMIN_EMAIL.toLowerCase()) {
                    showGlobalError("Acceso denegado: Este correo no tiene permisos.");
                    return;
                }
                if (!captchaToken) {
                    showGlobalError("Por favor, marca la casilla de seguridad.");
                    return;
                }

                btn.innerText = "Verificando...";
                btn.disabled = true;

                const { data, error } = await supabase.auth.signInWithPassword({ 
                    email: email, password: password, options: { captchaToken: captchaToken }
                });

                if (error) showGlobalError(error.message);
                else showDashboard();
            };

            // 3. Vistas Principales
            window.showDashboard = function() {
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('globalError').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                document.getElementById('navAuth').innerHTML = `<button onclick="logout()" class="text-gray-300 hover:text-white text-sm font-bold bg-gray-800 px-4 py-2 rounded transition"><i class="fas fa-sign-out-alt mr-1"></i> Salir</button>`;
                loadAllOrders();
            };

            window.logout = async function() {
                await supabase.auth.signOut();
                window.location.reload();
            };

            // 4. Extracción y Métricas
            window.loadAllOrders = async function() {
                const tbody = document.getElementById('ordersTableBody');
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Cargando órdenes...</td></tr>`;

                const { data: orders, error } = await supabase.from('orders').select('*').order('created_at', { ascending: false });

                if (error) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">Error: ${error.message}</td></tr>`;
                    return;
                }

                currentOrdersData = orders || [];
                updateMetrics();
                renderTable();
            };

            window.updateMetrics = function() {
                const today = new Date().toLocaleDateString();
                let countToday = 0, countPending = 0, countOnWay = 0, countDelivered = 0;

                currentOrdersData.forEach(o => {
                    const orderDate = new Date(o.created_at).toLocaleDateString();
                    if (orderDate === today) countToday++;
                    if (o.status === 'pendiente') countPending++;
                    if (o.status === 'en camino') countOnWay++;
                    if (o.status === 'entregado') countDelivered++;
                });

                document.getElementById('metricToday').innerText = countToday;
                document.getElementById('metricPending').innerText = countPending;
                document.getElementById('metricOnWay').innerText = countOnWay;
                document.getElementById('metricDelivered').innerText = countDelivered;
            };

            // 5. Renderizar Tabla con Filtros
            window.renderTable = function() {
                const searchTxt = document.getElementById('searchInput').value.toLowerCase();
                const statusFlt = document.getElementById('statusFilter').value;
                const tbody = document.getElementById('ordersTableBody');

                const filtered = currentOrdersData.filter(o => {
                    const matchSearch = (o.full_name || '').toLowerCase().includes(searchTxt) || 
                                        (o.phone || '').includes(searchTxt) || 
                                        (o.id || '').toLowerCase().includes(searchTxt);
                    const matchStatus = statusFlt === 'all' || o.status === statusFlt;
                    return matchSearch && matchStatus;
                });

                if (filtered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">No se encontraron resultados para tu búsqueda.</td></tr>`;
                    return;
                }

                let html = '';
                filtered.forEach(order => {
                    const dateObj = new Date(order.created_at);
                    const date = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const shortId = order.id.slice(0, 8);
                    
                    let bgStatus = "bg-yellow-100 text-yellow-800 border-yellow-200";
                    if (order.status === 'en camino') bgStatus = "bg-blue-100 text-blue-800 border-blue-200";
                    if (order.status === 'entregado') bgStatus = "bg-green-100 text-green-800 border-green-200";
                    if (order.status === 'cancelado') bgStatus = "bg-red-100 text-red-800 border-red-200";

                    // Alerta visual si hay nota interna
                    const noteIcon = order.internal_notes && order.internal_notes.trim() !== '' 
                        ? `<i class="fas fa-sticky-note text-yellow-500 ml-2" title="Tiene nota interna"></i>` : '';

                    html += `
                        <tr class="hover:bg-green-50 transition duration-150 border-b border-gray-100">
                            <td class="p-4">
                                <div class="font-mono text-xs font-bold text-gray-500 mb-1">#${shortId}</div>
                                <div class="text-xs text-gray-600"><i class="far fa-calendar-alt"></i> ${date}</div>
                            </td>
                            <td class="p-4">
                                <div class="font-bold text-gray-800">${order.full_name || 'Sin Nombre'} ${noteIcon}</div>
                                <div class="text-xs text-gray-500 mt-1"><i class="fas fa-phone mr-1"></i> ${order.phone || 'N/A'}</div>
                            </td>
                            <td class="p-4">
                                <div class="font-bold text-brand-green text-sm">${order.delivery_zone || 'N/A'}</div>
                            </td>
                            <td class="p-4 text-center">
                                <button type="button" onclick="openModal('${order.id}')" class="bg-white hover:bg-gray-100 text-brand-green py-1.5 px-4 rounded text-xs font-bold transition shadow-sm border border-brand-green">
                                    <i class="fas fa-folder-open mr-1"></i> Abrir
                                </button>
                            </td>
                            <td class="p-4 text-center">
                                <select onchange="updateStatus('${order.id}', this.value)" id="select-${order.id}" class="text-xs font-bold uppercase tracking-wide border rounded-full px-3 py-1.5 cursor-pointer focus:outline-none appearance-none text-center shadow-sm ${bgStatus}">
                                    <option value="pendiente" ${order.status === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                                    <option value="en camino" ${order.status === 'en camino' ? 'selected' : ''}>En Camino</option>
                                    <option value="entregado" ${order.status === 'entregado' ? 'selected' : ''}>Entregado</option>
                                    <option value="cancelado" ${order.status === 'cancelado' ? 'selected' : ''}>Cancelado</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            };

            // 6. Actualizar Estado
            window.updateStatus = async function(orderId, newStatus) {
                const { error } = await supabase.from('orders').update({ status: newStatus }).eq('id', orderId);
                if (error) {
                    alert("Error al actualizar: " + error.message);
                } else {
                    // Actualizamos memoria local para no tener que recargar todo de la BD
                    const orderIndex = currentOrdersData.findIndex(o => o.id === orderId);
                    if(orderIndex > -1) currentOrdersData[orderIndex].status = newStatus;
                    updateMetrics();
                    renderTable();
                }
            };

            // 7. Modal, WhatsApp y Notas Internas
            window.openModal = function(orderId) {
                const order = currentOrdersData.find(o => o.id === orderId);
                if(!order) return;
                
                document.getElementById('modalTitle').innerText = `Gestión de Orden #${order.id.slice(0,8)}`;
                
                const html = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                            <p class="text-xs text-gray-500 font-bold uppercase mb-3 border-b pb-2">Información del Cliente</p>
                            <p class="text-sm mb-2"><i class="fas fa-user text-brand-green w-5"></i> <span class="font-bold">${order.full_name || 'N/A'}</span></p>
                            <p class="text-sm mb-2"><i class="fas fa-envelope text-brand-green w-5"></i> ${order.user_email || 'N/A'}</p>
                            <p class="text-sm mb-3"><i class="fas fa-phone text-brand-green w-5"></i> ${order.phone || 'N/A'}</p>
                            
                            <div class="bg-green-50 p-3 rounded-lg border border-green-100">
                                <p class="text-xs font-bold text-green-800 mb-2"><i class="fab fa-whatsapp"></i> Notificar Estado (WhatsApp):</p>
                                <div class="flex gap-2">
                                    <button onclick="sendWA('${order.phone}', '${order.full_name}', 'es')" class="bg-green-500 hover:bg-green-600 text-white text-xs px-3 py-1.5 rounded shadow transition font-bold">
                                        Español
                                    </button>
                                    <button onclick="sendWA('${order.phone}', '${order.full_name}', 'en')" class="bg-gray-800 hover:bg-black text-white text-xs px-3 py-1.5 rounded shadow transition font-bold">
                                        English
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col gap-4">
                            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                <p class="text-xs text-gray-500 font-bold uppercase mb-2">Dirección de Entrega</p>
                                <p class="font-bold text-brand-green text-sm">${order.delivery_zone || 'N/A'}</p>
                                <p class="text-sm mt-1 text-gray-700">${order.delivery_address || 'N/A'}</p>
                            </div>
                            
                            <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-200 shadow-sm flex-grow flex flex-col">
                                <p class="text-xs text-yellow-800 font-bold uppercase mb-2"><i class="fas fa-lock mr-1"></i> Notas Internas (Privado)</p>
                                <textarea id="internalNotes-${order.id}" class="w-full text-sm p-2 rounded border border-yellow-300 focus:outline-none focus:border-yellow-500 flex-grow mb-2 bg-yellow-50/50" placeholder="Apunta aquí detalles de entrega, sustitutos pendientes...">${order.internal_notes || ''}</textarea>
                                <button onclick="saveNotes('${order.id}')" id="btnSaveNotes-${order.id}" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white text-xs font-bold py-2 rounded shadow transition">Guardar Notas</button>
                            </div>
                        </div>
                    </div>

                    <div>
                        <p class="text-xs text-gray-500 font-bold uppercase mb-2"><i class="fas fa-list mr-1"></i> Lista de Compras / Solicitud Original</p>
                        <div class="bg-gray-800 text-green-400 p-5 rounded-xl text-sm font-mono whitespace-pre-wrap overflow-x-auto shadow-inner border-l-4 border-brand-green">${order.shopping_list || 'Sin detalles.'}</div>
                    </div>
                `;
                document.getElementById('modalContent').innerHTML = html;
                document.getElementById('detailsModal').classList.remove('hidden');
            };

            window.closeModal = function() { document.getElementById('detailsModal').classList.add('hidden'); };

            window.sendWA = function(phoneRaw, name, lang) {
                if(!phoneRaw) { alert("El cliente no proporcionó teléfono."); return; }
                let cleanPhone = phoneRaw.replace(/[^\d+]/g, '');
                let firstName = name ? name.split(' ')[0] : 'Cliente';
                
                let text = '';
                if(lang === 'es') text = `¡Hola ${firstName}! Te escribimos de Shop Delivery Nic para confirmarte que tu pedido ya va en camino. 🚚`;
                else text = `Hello ${firstName}! This is Shop Delivery Nic. We're letting you know that your order is on its way. 🚚`;
                
                window.open(`https://wa.me/${cleanPhone.replace('+','')}?text=${encodeURIComponent(text)}`, '_blank');
            };

            window.saveNotes = async function(orderId) {
                const btn = document.getElementById(`btnSaveNotes-${orderId}`);
                const notes = document.getElementById(`internalNotes-${orderId}`).value;
                btn.innerText = "Guardando...";
                
                const { error } = await supabase.from('orders').update({ internal_notes: notes }).eq('id', orderId);
                
                if (error) {
                    alert("Error guardando nota: " + error.message);
                    btn.innerText = "Guardar Notas";
                } else {
                    const orderIndex = currentOrdersData.findIndex(o => o.id === orderId);
                    if(orderIndex > -1) currentOrdersData[orderIndex].internal_notes = notes;
                    btn.innerText = "¡Guardado!";
                    setTimeout(() => btn.innerText = "Guardar Notas", 2000);
                    renderTable(); // Para que aparezca el iconito amarillo en la tabla
                }
            };

        } catch(error) {
            showGlobalError("Fallo general: " + error.message);
        }
    </script>
</body>
</html>
